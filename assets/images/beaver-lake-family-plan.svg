<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Beaver Lake family day plan</title><desc id="d">A five-step family plan from the visitor center to a short trail, lake observation, picnic and exit decision</desc><rect width="1600" height="900" fill="#edf3e8"/><rect width="1600" height="220" fill="#173f35"/><text x="90" y="100" font-family="Arial" font-size="70" font-weight="700" fill="white">BEAVER LAKE: KEEP IT SMALL</text><text x="90" y="165" font-family="Arial" font-size="34" fill="#cae6d7">First-visit sequence · not a trail map or place photograph</text><path d="M180 500H1420" stroke="#274f43" stroke-width="14"/><g font-family="Arial" text-anchor="middle"><g transform="translate(190 500)"><circle r="76" fill="#ef6a2c"/><text y="15" font-size="46" font-weight="700" fill="white">1</text><text y="135" font-size="29" font-weight="700">CHECK IN</text><text y="175" font-size="23">map · restroom</text></g><g transform="translate(495 500)"><circle r="76" fill="#276b5d"/><text y="15" font-size="46" font-weight="700" fill="white">2</text><text y="135" font-size="29" font-weight="700">SHORT TRAIL</text><text y="175" font-size="23">one easy loop</text></g><g transform="translate(800 500)"><circle r="76" fill="#4d86a0"/><text y="15" font-size="46" font-weight="700" fill="white">3</text><text y="135" font-size="29" font-weight="700">OBSERVE</text><text y="175" font-size="23">slow down</text></g><g transform="translate(1105 500)"><circle r="76" fill="#d8a339"/><text y="15" font-size="46" font-weight="700">4</text><text y="135" font-size="29" font-weight="700">EAT</text><text y="175" font-size="23">before the crash</text></g><g transform="translate(1410 500)"><circle r="76" fill="#17211b"/><text y="15" font-size="46" font-weight="700" fill="white">5</text><text y="135" font-size="29" font-weight="700">DECIDE</text><text y="175" font-size="23">tiny add-on or exit</text></g></g><rect x="120" y="775" width="1360" height="4" fill="#9bb0a2"/><text x="800" y="835" text-anchor="middle" font-family="Arial" font-size="31" fill="#385246">Nine miles exist. Your family does not need to prove it.</text></svg>