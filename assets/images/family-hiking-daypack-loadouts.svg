<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Family hiking daypack loadouts</title><desc id="d">Three escalating loadout levels for a local loop, a half-day trail, and conditions with higher consequences</desc><rect width="1600" height="900" fill="#f5f1e8"/><text x="800" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="68" font-weight="700" fill="#17211b">PACK FOR THE CONSEQUENCES</text><text x="800" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#385246">The bag is the container. The plan is the safety system.</text><g font-family="Arial,sans-serif"><rect x="90" y="245" width="440" height="500" rx="32" fill="#dce9e5"/><text x="135" y="325" font-size="28" font-weight="700" fill="#276b5d">LOADOUT 1</text><text x="135" y="390" font-size="48" font-weight="700" fill="#17211b">LOCAL LOOP</text><text x="135" y="458" font-size="28" fill="#385246">water · snack · layer</text><text x="135" y="505" font-size="28" fill="#385246">first aid · light · map</text><text x="135" y="552" font-size="28" fill="#385246">medication · whistle</text><text x="135" y="670" font-size="27" font-weight="700" fill="#17211b">Easy retreat + nearby help</text><rect x="580" y="245" width="440" height="500" rx="32" fill="#f0d8ae"/><text x="625" y="325" font-size="28" font-weight="700" fill="#936423">LOADOUT 2</text><text x="625" y="390" font-size="48" font-weight="700" fill="#17211b">HALF DAY</text><text x="625" y="458" font-size="28" fill="#5f4b2d">more food + water</text><text x="625" y="505" font-size="28" fill="#5f4b2d">rain + insulation</text><text x="625" y="552" font-size="28" fill="#5f4b2d">shelter + repair margin</text><text x="625" y="670" font-size="27" font-weight="700" fill="#17211b">More delay to absorb</text><rect x="1070" y="245" width="440" height="500" rx="32" fill="#e4c6bd"/><text x="1115" y="325" font-size="28" font-weight="700" fill="#8b412f">LOADOUT 3</text><text x="1115" y="390" font-size="48" font-weight="700" fill="#17211b">UNCERTAINTY</text><text x="1115" y="458" font-size="28" fill="#644036">route-specific additions</text><text x="1115" y="505" font-size="28" fill="#644036">skills + communication</text><text x="1115" y="552" font-size="28" fill="#644036">or choose not to go</text><text x="1115" y="670" font-size="27" font-weight="700" fill="#17211b">Higher consequence</text></g><text x="800" y="835" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#17211b">FIT THE LOADED PACK TO THE ADULT WHO OWNS THE PROBLEM</text></svg>