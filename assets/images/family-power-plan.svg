<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Family phone power decision</title><desc id="d">A decision flow choosing no purchase, a car charger, a compact power bank or a larger power bank from actual phone demand</desc><rect width="1600" height="900" fill="#111a22"/><text x="800" y="92" text-anchor="middle" font-family="Arial" font-size="64" font-weight="700" fill="#fff7d7">PROTECT THE FUNCTION, THEN PICK THE POWER</text><text x="800" y="148" text-anchor="middle" font-family="Arial" font-size="28" fill="#c7d6df">Navigation, tickets and contact—not a capacity contest.</text><g font-family="Arial" text-anchor="middle"><rect x="420" y="220" width="760" height="130" rx="30" fill="#f0b36d"/><text x="800" y="275" font-size="30" font-weight="700" fill="#17211b">DOES THE PHONE FINISH THE REAL DAY?</text><text x="800" y="318" font-size="25" fill="#17211b">measure two ordinary trips</text><path d="M610 350v110M990 350v110" stroke="#c7d6df" stroke-width="10"/><text x="560" y="410" font-size="24" fill="#fff7d7">YES</text><text x="1040" y="410" font-size="24" fill="#fff7d7">NO</text><rect x="150" y="460" width="390" height="250" rx="28" fill="#244b5a"/><text x="345" y="530" font-size="34" font-weight="700" fill="#fff">NO-BUY</text><text x="345" y="580" font-size="24" fill="#dceaf0">charge · download · save</text><text x="345" y="620" font-size="24" fill="#dceaf0">test the cable you own</text><rect x="605" y="460" width="390" height="250" rx="28" fill="#4f4330"/><text x="800" y="530" font-size="34" font-weight="700" fill="#fff">NEAR THE CAR</text><text x="800" y="580" font-size="24" fill="#fff0cd">reliable car charger</text><text x="800" y="620" font-size="24" fill="#fff0cd">correct cable · secured cord</text><rect x="1060" y="460" width="390" height="250" rx="28" fill="#3c3a61"/><text x="1255" y="520" font-size="34" font-weight="700" fill="#fff">AWAY FROM CAR</text><text x="1255" y="568" font-size="24" fill="#e4e1ff">one phone: compact bank</text><text x="1255" y="608" font-size="24" fill="#e4e1ff">multiple/overnight: larger bank</text><text x="1255" y="653" font-size="21" fill="#e4e1ff">verify Wh · ports · recalls</text></g><text x="800" y="820" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff7d7">THE SMALLEST VERIFIED SYSTEM THAT COVERS THE GAP WINS.</text></svg>
