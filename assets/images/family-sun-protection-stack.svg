<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Family sun-protection stack</title><desc id="d">A four-layer framework of timing, shade, clothing and sunscreen with hats, sunglasses and a no-buy option</desc><rect width="1600" height="900" fill="#fff4da"/><circle cx="1410" cy="130" r="70" fill="#f2b544"/><g stroke="#f2b544" stroke-width="14"><path d="M1410 25v-55M1410 235v55M1305 130h-55M1515 130h55M1335 55l-40-40M1485 205l40 40M1485 55l40-40M1335 205l-40 40"/></g><text x="110" y="105" font-family="Arial" font-size="62" font-weight="700" fill="#17211b">SUN PROTECTION IS A STACK</text><text x="115" y="158" font-family="Arial" font-size="28" fill="#654d20">Use every layer you already own before buying another bottle.</text><g font-family="Arial"><rect x="120" y="665" width="1120" height="120" rx="24" fill="#315e78"/><text x="170" y="716" font-size="27" font-weight="700" fill="#d9edf7">LAYER 1</text><text x="360" y="737" font-size="44" font-weight="700" fill="#fff">TIME THE EXPOSED PART</text><rect x="190" y="520" width="1120" height="120" rx="24" fill="#2f7d6a"/><text x="240" y="571" font-size="27" font-weight="700" fill="#d8efe9">LAYER 2</text><text x="430" y="592" font-size="44" font-weight="700" fill="#fff">BUILD REAL SHADE</text><rect x="260" y="375" width="1120" height="120" rx="24" fill="#8d6b36"/><text x="310" y="426" font-size="27" font-weight="700" fill="#fff1d4">LAYER 3</text><text x="500" y="447" font-size="44" font-weight="700" fill="#fff">COVER SKIN + EYES</text><rect x="330" y="230" width="1120" height="120" rx="24" fill="#d77a45"/><text x="380" y="281" font-size="27" font-weight="700" fill="#fff3e8">LAYER 4</text><text x="570" y="302" font-size="44" font-weight="700" fill="#fff">SCREEN THE GAPS</text><rect x="1260" y="665" width="225" height="120" rx="24" fill="#fff" stroke="#315e78" stroke-width="5"/><text x="1372" y="712" text-anchor="middle" font-size="25" font-weight="700" fill="#315e78">CHECK THE</text><text x="1372" y="750" text-anchor="middle" font-size="25" font-weight="700" fill="#315e78">UV INDEX</text></g><text x="800" y="855" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#17211b">NO-BUY OPTION: ORGANIZE THE COVERAGE, SHADE AND SUNSCREEN YOU ALREADY HAVE.</text></svg>