<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Watkins Glen gorge-first family plan</title><desc id="d">A conceptual sequence from lower entrance to gorge walk, stair checkpoint, optional shuttle and pool or exit decision</desc><rect width="1600" height="900" fill="#eef3ed"/><text x="800" y="96" text-anchor="middle" font-family="Arial" font-size="62" font-weight="700" fill="#17211b">WATKINS GLEN: GORGE FIRST</text><text x="800" y="150" text-anchor="middle" font-family="Arial" font-size="28" fill="#385246">A family sequence—not a trail map.</text><path d="M130 675 C315 650 340 470 515 475 S735 620 900 470 S1140 280 1460 320" fill="none" stroke="#2f7d6a" stroke-width="24" stroke-linecap="round"/><g font-family="Arial" fill="#17211b"><circle cx="150" cy="670" r="58" fill="#f2c87b"/><text x="150" y="676" text-anchor="middle" font-size="26" font-weight="700">8:30</text><text x="85" y="770" font-size="30" font-weight="700">LOWER ENTRY</text><text x="85" y="812" font-size="24">restroom · notices · map</text><circle cx="515" cy="475" r="58" fill="#b9ddd2"/><text x="515" y="482" text-anchor="middle" font-size="27" font-weight="700">WALK</text><text x="375" y="365" font-size="31" font-weight="700">GORGE WHILE FRESH</text><text x="375" y="407" font-size="24">wet steps · close control</text><circle cx="900" cy="470" r="64" fill="#f0b36d"/><text x="900" y="461" text-anchor="middle" font-size="24" font-weight="700">STAIR</text><text x="900" y="491" text-anchor="middle" font-size="24" font-weight="700">CHECK</text><text x="760" y="590" font-size="24">turn around before form fades</text><circle cx="1260" cy="345" r="66" fill="#c7d9e7"/><text x="1260" y="337" text-anchor="middle" font-size="23" font-weight="700">SHUTTLE</text><text x="1260" y="370" text-anchor="middle" font-size="23" font-weight="700">OPTION</text><text x="1135" y="460" font-size="24">confirm it is running</text><rect x="1075" y="560" width="415" height="180" rx="26" fill="#fff" stroke="#315e78" stroke-width="5"/><text x="1282" y="625" text-anchor="middle" font-size="30" font-weight="700">POOL OR EXIT?</text><text x="1282" y="674" text-anchor="middle" font-size="24">one second act is enough</text></g><text x="800" y="858" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#17211b">THE SHUTTLE REDUCES BACKTRACKING. IT DOES NOT CREATE MORE ENERGY.</text></svg>