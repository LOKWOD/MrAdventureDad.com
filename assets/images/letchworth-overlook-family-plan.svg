<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Letchworth overlook-first family day</title><desc id="d">A conceptual car-linked sequence from southern waterfall views to one overlook, lunch, the nature center and an optional exit</desc><rect width="1600" height="900" fill="#edf3e8"/><text x="800" y="94" text-anchor="middle" font-family="Arial" font-size="62" font-weight="700" fill="#17211b">LETCHWORTH: THREE STOPS, NOT 66 MILES</text><text x="800" y="148" text-anchor="middle" font-family="Arial" font-size="28" fill="#385246">A family sequence—not a park map.</text><path d="M145 590 C330 370 505 690 700 460 S1040 330 1460 475" fill="none" stroke="#2f7d6a" stroke-width="26" stroke-linecap="round"/><g font-family="Arial" fill="#17211b"><circle cx="175" cy="565" r="72" fill="#9dcfbf"/><text x="175" y="553" text-anchor="middle" font-size="25" font-weight="700">UPPER +</text><text x="175" y="586" text-anchor="middle" font-size="25" font-weight="700">MIDDLE</text><text x="75" y="700" font-size="27" font-weight="700">WATERFALLS FIRST</text><text x="75" y="742" font-size="23">open paths · edge control</text><circle cx="700" cy="460" r="72" fill="#f0b36d"/><text x="700" y="451" text-anchor="middle" font-size="26" font-weight="700">ONE</text><text x="700" y="485" text-anchor="middle" font-size="26" font-weight="700">OVERLOOK</text><text x="558" y="335" font-size="25" font-weight="700">DRIVE, THEN WALK</text><text x="558" y="373" font-size="22">do not collect pull-offs</text><rect x="820" y="610" width="305" height="125" rx="26" fill="#fff" stroke="#8d6b36" stroke-width="5"/><text x="972" y="662" text-anchor="middle" font-size="27" font-weight="700">LUNCH</text><text x="972" y="702" text-anchor="middle" font-size="22">before the second act</text><circle cx="1370" cy="475" r="78" fill="#c9d8e8"/><text x="1370" y="465" text-anchor="middle" font-size="24" font-weight="700">NATURE</text><text x="1370" y="498" text-anchor="middle" font-size="24" font-weight="700">CENTER</text><text x="1250" y="620" font-size="23">or leave while it worked</text></g><text x="800" y="842" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17211b">THE CAR CONNECTS THE PAYOFFS. IT DOES NOT OBLIGATE YOU TO SEE EVERYTHING.</text></svg>