<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Family radio decision</title><desc id="d">A comparison of license-free FRS, licensed GMRS and a no-buy phone and meetup plan</desc><rect width="1600" height="900" fill="#f5f1e8"/><text x="800" y="105" text-anchor="middle" font-family="Arial" font-size="68" font-weight="700" fill="#17211b">BUY FOR THE REAL SEPARATION</text><text x="800" y="165" text-anchor="middle" font-family="Arial" font-size="30" fill="#385246">Terrain beats the mileage claim.</text><g font-family="Arial"><rect x="90" y="245" width="440" height="500" rx="32" fill="#dce9e5"/><text x="135" y="330" font-size="28" font-weight="700" fill="#276b5d">MOST FAMILIES</text><text x="135" y="400" font-size="54" font-weight="700">FRS</text><text x="135" y="465" font-size="27">license-free · simple</text><text x="135" y="510" font-size="27">short-distance trips</text><text x="135" y="675" font-size="25" font-weight="700">Start here</text><rect x="580" y="245" width="440" height="500" rx="32" fill="#cbdfea"/><text x="625" y="330" font-size="28" font-weight="700" fill="#315e78">NAMED CAPABILITY</text><text x="625" y="400" font-size="54" font-weight="700">GMRS</text><text x="625" y="465" font-size="27">license required</text><text x="625" y="510" font-size="27">adult-managed system</text><text x="625" y="675" font-size="25" font-weight="700">Buy only with a reason</text><rect x="1070" y="245" width="440" height="500" rx="32" fill="#f0d8ae"/><text x="1115" y="330" font-size="28" font-weight="700" fill="#936423">STAYING TOGETHER</text><text x="1115" y="400" font-size="54" font-weight="700">NO BUY</text><text x="1115" y="465" font-size="27">charged phones</text><text x="1115" y="510" font-size="27">written meetup plan</text><text x="1115" y="675" font-size="25" font-weight="700">Less gear can be safer</text></g><text x="800" y="835" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#17211b">A RADIO SUPPORTS THE PLAN. IT IS NOT THE PLAN.</text></svg>