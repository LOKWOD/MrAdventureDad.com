<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Taughannock Falls family day plan</title><desc id="d">A planning sequence for the gorge trail, overlook, lunch and a status-dependent optional activity</desc><rect width="1600" height="900" fill="#eef3e7"/><path d="M0 0h1600v235H0z" fill="#173f35"/><text x="90" y="105" font-family="Arial" font-size="72" font-weight="700" fill="#fff">TAUGHANNOCK: GORGE FIRST</text><text x="90" y="170" font-family="Arial" font-size="36" fill="#c9e5d5">Planning sequence · not a trail map or place photograph</text><path d="M170 510H1430" stroke="#173f35" stroke-width="16"/><g font-family="Arial" text-anchor="middle"><g transform="translate(190 510)"><circle r="78" fill="#ef6a2c"/><text y="15" font-size="46" font-weight="700" fill="#fff">1</text><text y="135" font-size="32" font-weight="700">ARRIVE</text><text y="177" font-size="25">map + restroom</text></g><g transform="translate(495 510)"><circle r="78" fill="#276b5d"/><text y="15" font-size="46" font-weight="700" fill="#fff">2</text><text y="135" font-size="32" font-weight="700">GORGE</text><text y="177" font-size="25">out + back early</text></g><g transform="translate(800 510)"><circle r="78" fill="#4d86a0"/><text y="15" font-size="46" font-weight="700" fill="#fff">3</text><text y="135" font-size="32" font-weight="700">OVERLOOK</text><text y="177" font-size="25">short visual payoff</text></g><g transform="translate(1105 510)"><circle r="78" fill="#d8a339"/><text y="15" font-size="46" font-weight="700">4</text><text y="135" font-size="32" font-weight="700">LUNCH</text><text y="177" font-size="25">before the crash</text></g><g transform="translate(1410 510)"><circle r="78" fill="#17211b"/><text y="15" font-size="46" font-weight="700" fill="#fff">5</text><text y="135" font-size="32" font-weight="700">CHECK</text><text y="177" font-size="25">weather + beach</text></g></g><rect x="100" y="785" width="1400" height="4" fill="#9bb0a2"/><text x="800" y="840" text-anchor="middle" font-family="Arial" font-size="30" fill="#385246">If the beach is closed, the day still works. If thunder arrives, the gorge does not.</text></svg>