<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Family outdoor lighting system</title><desc id="d">A three-role framework assigning headlamps to movement, flashlights to independent backup and lanterns to stationary areas</desc><rect width="1600" height="900" fill="#111a22"/><text x="800" y="96" text-anchor="middle" font-family="Arial" font-size="64" font-weight="700" fill="#fff7d7">LIGHT THE JOB, NOT THE WHOLE FOREST</text><text x="800" y="150" text-anchor="middle" font-family="Arial" font-size="29" fill="#c7d6df">Three roles. Two independent power paths. One adult-owned plan.</text><g font-family="Arial"><rect x="90" y="245" width="440" height="470" rx="34" fill="#244b5a"/><circle cx="310" cy="350" r="72" fill="#f2c45b"/><path d="M250 350h120M310 290v120" stroke="#fff7d7" stroke-width="18"/><text x="310" y="485" text-anchor="middle" font-size="42" font-weight="700" fill="#fff">HEADLAMP</text><text x="310" y="535" text-anchor="middle" font-size="27" fill="#dceaf0">MOVE + WORK</text><text x="310" y="600" text-anchor="middle" font-size="23" fill="#dceaf0">hands free · low mode · lock</text><rect x="580" y="245" width="440" height="470" rx="34" fill="#4f4330"/><path d="M710 290h170l65 55-65 55H710z" fill="#f0b36d"/><rect x="675" y="267" width="75" height="156" rx="18" fill="#fff0cd"/><text x="800" y="485" text-anchor="middle" font-size="42" font-weight="700" fill="#fff">FLASHLIGHT</text><text x="800" y="535" text-anchor="middle" font-size="27" fill="#fff0cd">FIND + BACK UP</text><text x="800" y="600" text-anchor="middle" font-size="23" fill="#fff0cd">independent power · easy handoff</text><rect x="1070" y="245" width="440" height="470" rx="34" fill="#3c3a61"/><path d="M1225 430h250l-45-150h-160z" fill="#d8d4ff"/><path d="M1270 280q80-100 160 0" fill="none" stroke="#f2c45b" stroke-width="16"/><text x="1290" y="485" text-anchor="middle" font-size="42" font-weight="700" fill="#fff">LANTERN</text><text x="1290" y="535" text-anchor="middle" font-size="27" fill="#e4e1ff">STAY + SHARE</text><text x="1290" y="600" text-anchor="middle" font-size="23" fill="#e4e1ff">table · tent · dimmed area light</text></g><text x="800" y="815" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff7d7">NO-BUY OPTION: TEST, LABEL AND STANDARDIZE THE LIGHTS YOU ALREADY OWN.</text></svg>