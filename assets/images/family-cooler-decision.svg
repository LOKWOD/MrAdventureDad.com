<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Family cooler decision guide</title><desc id="d">A practical flow from trip needs to soft, hard or backpack cooler choices</desc><rect width="1600" height="900" fill="#f5f1e8"/><circle cx="800" cy="175" r="115" fill="#284a3c"/><text x="800" y="160" text-anchor="middle" font-family="Arial" font-size="44" font-weight="700" fill="white">THE</text><text x="800" y="215" text-anchor="middle" font-family="Arial" font-size="44" font-weight="700" fill="white">REAL JOB</text><path d="M800 290v120M800 410H280v115m520-115v115m0-115h520v115" fill="none" stroke="#111815" stroke-width="12"/><g font-family="Arial" text-anchor="middle"><rect x="90" y="525" width="380" height="245" rx="28" fill="#ff6a2a"/><text x="280" y="620" font-size="50" font-weight="700" fill="white">SOFT</text><text x="280" y="680" font-size="31" fill="white">one meal · short carry</text><rect x="610" y="525" width="380" height="245" rx="28" fill="#111815"/><text x="800" y="620" font-size="50" font-weight="700" fill="white">HARD</text><text x="800" y="680" font-size="31" fill="white">car base · long hold</text><rect x="1130" y="525" width="380" height="245" rx="28" fill="#284a3c"/><text x="1320" y="620" font-size="50" font-weight="700" fill="white">BACKPACK</text><text x="1320" y="680" font-size="31" fill="white">food must move</text></g><text x="800" y="845" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#111815">SMALLEST COOLER THAT KEEPS THE FOOD SAFE</text></svg>