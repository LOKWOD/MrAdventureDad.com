<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Green Lakes family day sequence</title><desc id="d">Five-step planning sequence: arrive, walk, eat, choose one extra activity, and leave while the day is still good</desc><rect width="1600" height="900" fill="#eef3e7"/><path d="M0 0h1600v245H0z" fill="#173f35"/><text x="100" y="115" font-family="Arial,sans-serif" font-size="74" font-weight="700" fill="#fff">GREEN LAKES: ONE GOOD DAY</text><text x="100" y="180" font-family="Arial,sans-serif" font-size="38" fill="#c9e5d5">A planning sequence — not a trail map</text><path d="M160 520H1440" stroke="#173f35" stroke-width="18" stroke-linecap="round"/><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(180 520)"><circle r="78" fill="#ef6a2c"/><text y="15" font-size="46" font-weight="700" fill="#fff">1</text><text y="135" font-size="34" font-weight="700" fill="#17211b">ARRIVE</text><text y="177" font-size="26" fill="#385246">map + restroom</text></g><g transform="translate(490 520)"><circle r="78" fill="#276b5d"/><text y="15" font-size="46" font-weight="700" fill="#fff">2</text><text y="135" font-size="34" font-weight="700" fill="#17211b">WALK</text><text y="177" font-size="26" fill="#385246">before the rush</text></g><g transform="translate(800 520)"><circle r="78" fill="#d8a339"/><text y="15" font-size="46" font-weight="700" fill="#17211b">3</text><text y="135" font-size="34" font-weight="700" fill="#17211b">EAT</text><text y="177" font-size="26" fill="#385246">before the crash</text></g><g transform="translate(1110 520)"><circle r="78" fill="#4d86a0"/><text y="15" font-size="46" font-weight="700" fill="#fff">4</text><text y="135" font-size="34" font-weight="700" fill="#17211b">ONE EXTRA</text><text y="177" font-size="26" fill="#385246">beach · boat · play</text></g><g transform="translate(1420 520)"><circle r="78" fill="#17211b"/><text y="15" font-size="46" font-weight="700" fill="#fff">5</text><text y="135" font-size="34" font-weight="700" fill="#17211b">LEAVE</text><text y="177" font-size="26" fill="#385246">while it is good</text></g></g><rect x="100" y="785" width="1400" height="4" fill="#9bb0a2"/><text x="800" y="840" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#385246">Check the official map, beach status, weather and park notices before leaving home.</text></svg>