<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The family hotel room system</title><desc id="desc">A five-zone hotel room setup for the door, sleep, charging, bathroom and morning exit</desc><rect width="1600" height="900" fill="#0f1922"/><text x="800" y="92" text-anchor="middle" fill="#fff4d6" font-family="Arial,sans-serif" font-size="64" font-weight="800">LAND ONCE. SLEEP. LEAVE CLEAN.</text><text x="800" y="145" text-anchor="middle" fill="#c7d5df" font-family="Arial,sans-serif" font-size="28">Five zones keep a two-night room from becoming a luggage explosion.</text><g font-family="Arial,sans-serif"><rect x="75" y="230" width="260" height="330" rx="32" fill="#f2b364"/><text x="205" y="305" text-anchor="middle" fill="#142027" font-size="26" font-weight="700">1 · DOOR</text><text x="205" y="365" text-anchor="middle" fill="#142027" font-size="34" font-weight="800">ARRIVAL BIN</text><text x="205" y="420" text-anchor="middle" fill="#24353d" font-size="24">shoes · keys</text><text x="205" y="458" text-anchor="middle" fill="#24353d" font-size="24">tomorrow bag</text><text x="205" y="505" text-anchor="middle" fill="#24353d" font-size="21">keep the exit clear</text><rect x="372" y="230" width="260" height="330" rx="32" fill="#b8d1c4"/><text x="502" y="305" text-anchor="middle" fill="#142027" font-size="26" font-weight="700">2 · BEDS</text><text x="502" y="365" text-anchor="middle" fill="#142027" font-size="34" font-weight="800">SLEEP ZONE</text><text x="502" y="420" text-anchor="middle" fill="#24353d" font-size="24">one bed each</text><text x="502" y="458" text-anchor="middle" fill="#24353d" font-size="24">clothes off beds</text><text x="502" y="505" text-anchor="middle" fill="#24353d" font-size="21">lights-out agreement</text><rect x="669" y="230" width="260" height="330" rx="32" fill="#bed0e5"/><text x="799" y="305" text-anchor="middle" fill="#142027" font-size="26" font-weight="700">3 · DESK</text><text x="799" y="365" text-anchor="middle" fill="#142027" font-size="34" font-weight="800">POWER ZONE</text><text x="799" y="420" text-anchor="middle" fill="#24353d" font-size="24">adult charging</text><text x="799" y="458" text-anchor="middle" fill="#24353d" font-size="24">water away</text><text x="799" y="505" text-anchor="middle" fill="#24353d" font-size="21">cables checked</text><rect x="966" y="230" width="260" height="330" rx="32" fill="#d8c4e8"/><text x="1096" y="305" text-anchor="middle" fill="#142027" font-size="26" font-weight="700">4 · BATH</text><text x="1096" y="365" text-anchor="middle" fill="#142027" font-size="34" font-weight="800">WET ZONE</text><text x="1096" y="420" text-anchor="middle" fill="#24353d" font-size="24">swim · towels</text><text x="1096" y="458" text-anchor="middle" fill="#24353d" font-size="24">toiletries together</text><text x="1096" y="505" text-anchor="middle" fill="#24353d" font-size="21">no towels on lamps</text><rect x="1263" y="230" width="260" height="330" rx="32" fill="#f5d19c"/><text x="1393" y="305" text-anchor="middle" fill="#142027" font-size="26" font-weight="700">5 · MORNING</text><text x="1393" y="365" text-anchor="middle" fill="#142027" font-size="34" font-weight="800">EXIT SWEEP</text><text x="1393" y="420" text-anchor="middle" fill="#24353d" font-size="24">beds · outlets</text><text x="1393" y="458" text-anchor="middle" fill="#24353d" font-size="24">bath · drawers</text><text x="1393" y="505" text-anchor="middle" fill="#24353d" font-size="21">adult checks last</text></g><path d="M205 610 H1393" stroke="#56c6ad" stroke-width="8"/><path d="M1393 610 l-30 -18 v36 z" fill="#56c6ad"/><rect x="315" y="675" width="970" height="105" rx="28" fill="#183942"/><text x="800" y="740" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="32" font-weight="700">THE ROOM IS A BASE CAMP—NOT THE VACATION.</text><text x="70" y="850" fill="#95a8b2" font-family="Arial,sans-serif" font-size="20">Mr Adventure Dad · original editorial diagram · not a room plan or safety map</text></svg>
