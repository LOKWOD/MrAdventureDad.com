<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Family rain gear decision</title><desc id="d">Three rain gear choices matched to escape coverage, active movement and compact storage</desc><rect width="1600" height="900" fill="#f5f1e8"/><text x="800" y="105" text-anchor="middle" font-family="Arial" font-size="68" font-weight="700" fill="#17211b">RAIN GEAR HAS A JOB</text><text x="800" y="165" text-anchor="middle" font-family="Arial" font-size="30" fill="#385246">Choose by exposure, movement and consequence.</text><g font-family="Arial"><rect x="90" y="245" width="440" height="500" rx="32" fill="#dce9e5"/><text x="135" y="330" font-size="28" font-weight="700" fill="#276b5d">FAST COVERAGE</text><text x="135" y="400" font-size="50" font-weight="700">PONCHO</text><text x="135" y="465" font-size="28">events · parking lots</text><text x="135" y="510" font-size="28">short walks</text><text x="135" y="675" font-size="26" font-weight="700">Watch wind + loose hems</text><rect x="580" y="245" width="440" height="500" rx="32" fill="#cbdfea"/><text x="625" y="330" font-size="28" font-weight="700" fill="#315e78">ACTIVE MOVEMENT</text><text x="625" y="400" font-size="50" font-weight="700">RAIN JACKET</text><text x="625" y="465" font-size="28">trails · shorelines</text><text x="625" y="510" font-size="28">repeat use</text><text x="625" y="675" font-size="26" font-weight="700">Fit hood + warm layers</text><rect x="1070" y="245" width="440" height="500" rx="32" fill="#f0d8ae"/><text x="1115" y="330" font-size="28" font-weight="700" fill="#936423">SMALL BACKUP</text><text x="1115" y="400" font-size="50" font-weight="700">PACKABLE</text><text x="1115" y="465" font-size="28">car kit · daypack</text><text x="1115" y="510" font-size="28">limited storage</text><text x="1115" y="675" font-size="26" font-weight="700">Verify real construction</text></g><text x="800" y="835" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#17211b">NONE OF THEM MAKE LIGHTNING SAFE</text></svg>