name: Deploy Mr Adventure Dad

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate expanded family-adventure library
        run: |
          node scripts/generate-expansion.mjs
          node scripts/generate-expansion-two.mjs
      - name: Inject website visitor light beacon
        run: node scripts/inject-visitor-beacon.mjs . mr-adventure-dad
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Let GitHub's branch publisher finish first
        if: github.event_name == 'push'
        run: sleep 75
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
